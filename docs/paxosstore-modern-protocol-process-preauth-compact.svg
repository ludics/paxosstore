  <text x="654" y="476">ConsumeMsgReqQueue</text>
  <text x="654" y="492">1. serialize</text>
  <text x="654" y="506">2. Write + Flush</text>

  <polyline fill="none" stroke="#000" marker-end="url(#arr)" points="720,516 720,536 638,536"/>
  <rect x="650" y="528" width="52" height="14" fill="#fff"/>
