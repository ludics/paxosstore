  <text x="334" y="646">MultiSetRecords</text>
  <text x="334" y="662">1. persist Chosen</text>
  <text x="334" y="676">2. PlogRspQueue</text>
  <text x="334" y="690">3. WriteBatch</text>

  <polyline fill="none" stroke="#000" marker-end="url(#arr)" points="400,702 400,722 240,722 240,738"/>
  <rect x="292" y="714" width="76" height="14" fill="#fff"/>
  <text x="330" y="725" text-anchor="middle">PlogRspQueue</text>

  <rect x="170" y="740" width="140" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="174" y="756">HandleSetFromPlog</text>
  <text x="174" y="772">1. UpdateByChosenEntry</text>
  <text x="174" y="786">2. pre_auth_entry=entry</text>
  <text x="174" y="800">3. DbWorker async</text>
  <text x="174" y="814">4. FinishClientCmd(0)</text>

