  <!-- HandleWriteCmd: Promise + Accept in one call -->
  <rect x="170" y="110" width="140" height="150" rx="21" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="174" y="126">HandleWriteCmd</text>
  <text x="174" y="142">1. pre_auth_entry+1</text>
  <text x="174" y="156">2. Promise(pre_auth=1)</text>
  <text x="174" y="170">3. pn = aid+1 (e.g. 1)</text>
  <text x="174" y="184">4. IsLocalAcceptable</text>
  <text x="174" y="198">5. machine-&gt;Accept</text>
  <text x="174" y="212">6. kAcceptLocal</text>
  <text x="174" y="226">7. StoreEntryInfo</text>
  <text x="174" y="240">8. PlogReqQueue</text>
  <text x="174" y="254">skip Phase 1 net</text>

