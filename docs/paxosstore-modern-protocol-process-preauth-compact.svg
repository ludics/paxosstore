  <text x="334" y="302">1. SetRecord batch</text>
  <text x="334" y="316">2. persist Accepted</text>
  <text x="334" y="330">3. PlogRspQueue</text>
  <text x="334" y="344">4. WriteBatch</text>

  <polyline fill="none" stroke="#000" marker-end="url(#arr)" points="330,310 240,310 240,368"/>
