  <text x="174" y="386">HandleSetFromPlog</text>
  <text x="174" y="402">1. broadcast=true</text>
  <text x="174" y="416">2. Broadcast Accept</text>
  <text x="174" y="430">3. SyncToPeer x N-1</text>
  <text x="174" y="444">4. GoAndDeleteIfFailed</text>

  <line x1="310" y1="410" x2="488" y2="410" stroke="#000" marker-end="url(#arr)"/>
