  <text x="974" y="306">MultiSetRecords</text>
  <text x="974" y="322">1. SetRecord batch</text>
  <text x="974" y="336">2. persist Accepted</text>
  <text x="974" y="350">3. PlogRspQueue</text>
  <text x="974" y="364">4. WriteBatch</text>

