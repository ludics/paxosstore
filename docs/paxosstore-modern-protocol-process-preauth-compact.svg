  <text x="814" y="172">1. SwitchToLocalView</text>
  <text x="814" y="186">2. machine-&gt;Update</text>
  <text x="814" y="200">3. kAcceptRemote</text>
  <text x="814" y="214">4. local_updated</text>
  <text x="814" y="228">5. StoreEntryInfo</text>
  <text x="814" y="242">6. PlogReqQueue</text>
  <text x="814" y="256">no Promise() call</text>

  <polyline fill="none" stroke="#000" marker-end="url(#arr)" points="950,210 1040,210 1040,288"/>
  <rect x="978" y="202" width="76" height="14" fill="#fff"/>
  <text x="1016" y="213" text-anchor="middle">PlogReqQueue</text>

