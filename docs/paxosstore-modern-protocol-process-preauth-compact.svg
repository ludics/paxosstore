  <text x="654" y="82">1. HandleRead bytes</text>
  <text x="654" y="96">2. CreateCmd</text>
  <text x="654" y="110">3. EntityReqQueue</text>
  <text x="654" y="124">first msg = Accept</text>

  <polyline fill="none" stroke="#000" marker-end="url(#arr)" points="790,90 880,90 880,138"/>
