  <text x="174" y="546">2. majority Accept</text>
  <text x="174" y="560">3. kChosen (memory)</text>
  <text x="174" y="574">4. StoreEntryInfo</text>
  <text x="174" y="588">5. PlogReqQueue</text>
  <text x="174" y="602">1 peer enough (N=3)</text>

